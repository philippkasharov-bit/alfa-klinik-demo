<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A — Атлас · Альфа-Клиник</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--paper:#F2EEE6;--ink:#1B1A17;--muted:#5E5A52;--rule:#CFC7B8;--oxide:#A8432C;--g:clamp(16px,3vw,40px)}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
.top{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;padding:18px var(--g);border-bottom:1px solid var(--ink);font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase}
.top b{grid-column:span 4;font:500 17px/1 Literata,serif;text-transform:none;letter-spacing:0}
.top nav{grid-column:span 5;display:flex;gap:22px}.top .r{grid-column:span 3;text-align:right}
.hero{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;padding:0 var(--g);min-height:calc(100svh - 52px)}
.copy{grid-column:1/6;padding:clamp(32px,6vh,72px) 0 32px;display:flex;flex-direction:column;border-right:1px solid var(--rule);padding-right:24px}
.fig{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--oxide);letter-spacing:.04em}
h1{margin-top:28px;font:400 clamp(44px,5.4vw,84px)/.98 Literata,serif;letter-spacing:-.025em}
h1 span{color:var(--oxide)}
.lead{margin-top:28px;max-width:34ch;font-size:18px;color:var(--muted)}
.cta{margin-top:auto;display:flex;gap:18px;align-items:center;padding-top:32px}
.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 22px;background:var(--ink);color:var(--paper);text-decoration:none;font:500 15px/1 "IBM Plex Sans"}
.cta a.t{color:var(--ink);font:500 15px/1 "IBM Plex Mono",monospace}
.plate{grid-column:6/13;position:relative;display:grid;place-items:center;overflow:hidden}
.plate img{width:min(70%,560px);height:auto;filter:drop-shadow(0 30px 40px rgba(27,26,23,.12));animation:in 1.4s cubic-bezier(.16,1,.3,1) both}
.grid{position:absolute;inset:0;background:linear-gradient(var(--rule) 1px,transparent 1px) 0 0/100% 25%,linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/25% 100%;opacity:.55}
.n{position:absolute;display:flex;align-items:center;gap:10px;font:400 12px/1.3 "IBM Plex Mono",monospace;color:var(--ink)}
.n i{width:64px;height:1px;background:var(--oxide)}.n em{font-style:normal;color:var(--oxide)}
.n1{top:24%;right:4%}.n2{top:52%;left:3%;flex-direction:row-reverse}.n3{bottom:16%;right:8%}
.cap{position:absolute;left:0;bottom:0;right:0;display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--ink);font:400 12px/1 "IBM Plex Mono",monospace;background:var(--paper)}
@keyframes in{from{opacity:0;transform:translateY(24px) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.plate img{animation:none}}
@media (max-width:760px){.top nav{display:none}.top b{grid-column:span 7}.top .r{grid-column:span 5}
.hero{grid-template-columns:1fr}.copy{grid-column:1;border:0;padding-right:0}.plate{grid-column:1;min-height:420px}.n2{display:none}.n i{width:28px}.cta{margin-top:24px;flex-wrap:wrap}}
</style></head><body>
<header class="top"><b>Альфа-Клиник</b><nav><span>Услуги</span><span>Цены</span><span>Акции</span><span>Контакты</span></nav><span class="r">(499) 739-51-63</span></header>
<main class="hero">
  <section class="copy">
    <p class="fig">Табл. 01 — стоматология, Воронцовские пруды, 3</p>
    <h1>Внимательная стоматология <span>и понятное лечение</span></h1>
    <p class="lead">Понятно объясняем план лечения, его стоимость, сроки и гарантии. Результаты консультации выдаём на руки.</p>
    <div class="cta"><a class="btn" href="#">Записаться на приём →</a><a class="t" href="#">(499) 739-51-63</a></div>
  </section>
  <figure class="plate">
    <span class="grid"></span>
    <img src="/models/tooth-profile.webp" alt="" width="720" height="720">
    <p class="n n1"><i></i><span><em>01</em> Диагностика<br>3D-сканирование, визиография</span></p>
    <p class="n n2"><i></i><span><em>02</em> Гигиена<br>7 процедур</span></p>
    <p class="n n3"><i></i><span><em>03</em> Протезирование<br>DUCERAM · VITA · Noritake</span></p>
    <figcaption class="cap"><span>Рис. 1 — моляр, вид сбоку</span><span>09:00–21:00 · вс — выходной</span></figcaption>
  </figure>
</main>
</body></html>
